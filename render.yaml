services:
  # Backend Web Service
  - type: web
    name: ai-mom-api
    env: node
    plan: free
    repo: https://github.com/SohamLonkar1026/ToDo-with-LLM-and-Telegram-Backend
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "https://ai-mom-app.vercel.app"  # Update this to your actual Vercel URL
